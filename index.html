<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify - Your favourite music is here</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<nav>
<ul>
<li class="brand"><img src="logo.png" alt="Spotify">Spotify</li>
</ul>
</nav>

<div class="container">
<div class="songList">
<h1>Best of Taylor Swift - Swifties Edition</h1>

<img src="covers/1.png" alt="The Fate of Ophelia">

<span class="songlistplay"><span class="timestamp">04:01 <i id="0" class="fa-solid fa-circle-play songItemPlay"></i></span></span>

<img src="covers/2.png" alt="Cruel Summer">

</div>

<div class="songItem">
<img src="covers/3.png" alt="Style">
<span class="songName">Style</span>
<span class="songlistplay"><span class="timestamp">03:51 <i id="2" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
</div>

<div class="songItem">
<img src="covers/4.png" alt="Speak Now">
<span class="songName">Speak Now</span>

</div>

<div class="songItem">
<img src="covers/5.png" alt="Begin Again">
<span class="songName">Begin Again</span>

</div>

<div class="songItem">
<img src="covers/6.png" alt="Timeless">
<span class="songName">Timeless (Taylor's Version)</span>

</div>

<div class="songItem">
<img src="covers/7.jpg" alt="If This Was A Movie">
<span class="songName">If This Was A Movie</span>
<span class="songlistplay"><span class="timestamp">03:55 <i id="6" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
</div>

<div class="songItem">
<img src="covers/8.png" alt="Red">
<span class="songName">Red</span>

<div class="songItem">
<img src="covers/9.png" alt="Clean">

<div class="songItem">
<img src="covers/10.png" alt="The Other Side of the Door">

</div>
</div>
</div>

</div>

<div class="bottom">
<input type="range" id="myProgressBar" min="0" value="0" max="100">
<div class="icons">
<i class="fa-solid fa-backward" id="previous"></i>
<i class="fa-solid fa-circle-play" id="masterPlay"></i>
<i class="fa-solid fa-forward" id="next"></i>
</div>
<div class="songInfo">
<img src="playing.gif" width="42px" alt="Playing" id="gif">
<span id="masterSongName">The Fate of Ophelia</span>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
